name: CI and Update GitOps Repo

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        SHA_SHORT=$(git rev-parse --short HEAD)
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

        docker build -t ghcr.io/${OWNER_LOWER}/k8s-demo:${SHA_SHORT} ./app
        docker push ghcr.io/${OWNER_LOWER}/k8s-demo:${SHA_SHORT}
        echo "NEW_TAG=${SHA_SHORT}" >> $GITHUB_ENV
        echo "REPO_OWNER=${OWNER_LOWER}" >> $GITHUB_ENV

    - name: Update Kubernetes Manifest
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"

        sed -i "s|image: ghcr.io/${{ env.REPO_OWNER }}/k8s-demo:.*|image: ghcr.io/${{ env.REPO_OWNER }}/k8s-demo:${{ env.NEW_TAG }}|g" k8s/deployment.yaml

        git add k8s/deployment.yaml
        git commit -m "chore: update image tag to ${{ env.NEW_TAG }} [skip ci]"
        git push
